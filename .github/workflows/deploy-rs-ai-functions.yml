name: Deploy RS AI Edge Functions

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/ai-coach-chat/**'
      - 'supabase/functions/ai-voice-speech/**'
      - '.github/workflows/deploy-rs-ai-functions.yml'

concurrency:
  group: rs-ai-edge-functions-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: tmniqitbqucatrycoocg
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Supabase deployment secret
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret SUPABASE_ACCESS_TOKEN"
            exit 1
          fi

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy RS AI Coach
        run: supabase functions deploy ai-coach-chat --project-ref "$PROJECT_REF" --use-api

      - name: Deploy RS Premium Voice
        run: supabase functions deploy ai-voice-speech --project-ref "$PROJECT_REF" --use-api
