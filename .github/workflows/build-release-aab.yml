name: Build RS KICKBOX Signed AAB

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RS_KEYSTORE_B64: ${{ secrets.RS_ANDROID_KEYSTORE_BASE64 }}
      RS_STORE_PASSWORD: ${{ secrets.RS_ANDROID_KEYSTORE_PASSWORD }}
      RS_KEY_ALIAS: ${{ secrets.RS_ANDROID_KEY_ALIAS }}
      RS_KEY_PASSWORD: ${{ secrets.RS_ANDROID_KEY_PASSWORD }}
      RS_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      RS_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RS_KEYSTORE_B64" || (echo "Missing RS_ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$RS_STORE_PASSWORD" || (echo "Missing RS_ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$RS_KEY_ALIAS" || (echo "Missing RS_ANDROID_KEY_ALIAS" && exit 1)
          test -n "$RS_KEY_PASSWORD" || (echo "Missing RS_ANDROID_KEY_PASSWORD" && exit 1)
          test -n "$RS_SUPABASE_URL" || (echo "Missing SUPABASE_URL" && exit 1)
          test -n "$RS_SUPABASE_PUBLISHABLE_KEY" || (echo "Missing SUPABASE_PUBLISHABLE_KEY" && exit 1)

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Restore signing keystore
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/rs-signing"
          printf '%s' "$RS_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/rs-signing/rs-release.jks"
          test -s "$RUNNER_TEMP/rs-signing/rs-release.jks"

      - name: Build signed release AAB
        shell: bash
        run: |
          gradle :app:bundleRelease --stacktrace \
            -PRS_RELEASE_STORE_FILE="$RUNNER_TEMP/rs-signing/rs-release.jks" \
            -PRS_RELEASE_STORE_PASSWORD="$RS_STORE_PASSWORD" \
            -PRS_RELEASE_KEY_ALIAS="$RS_KEY_ALIAS" \
            -PRS_RELEASE_KEY_PASSWORD="$RS_KEY_PASSWORD" \
            -PSUPABASE_URL="$RS_SUPABASE_URL" \
            -PSUPABASE_PUBLISHABLE_KEY="$RS_SUPABASE_PUBLISHABLE_KEY"

      - name: Verify AAB exists
        shell: bash
        run: |
          test -s app/build/outputs/bundle/release/app-release.aab
          ls -lh app/build/outputs/bundle/release/app-release.aab

      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: RS-KICKBOX-v0.105.0-signed-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary keystore
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/rs-signing"
