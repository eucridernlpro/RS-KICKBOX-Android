name: Build RS KICKBOX Preview APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-preview-apk.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-preview-apk.yml'

concurrency:
  group: rs-kickbox-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Restore persistent preview signing key
        id: preview-key-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: rs-kickbox-preview-debug-keystore-v1

      - name: Create preview signing key if missing
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v               -keystore "$HOME/.android/debug.keystore"               -storepass android               -alias androiddebugkey               -keypass android               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=RS KICKBOXING Preview,O=RS KICKBOXING,C=NL"
          fi

      - name: Show preview signing fingerprint
        run: |
          keytool -list -v             -keystore "$HOME/.android/debug.keystore"             -storepass android             -alias androiddebugkey | grep -E "SHA256:|SHA1:" || true

      - name: Build installable debug APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          ARGS=()
          if [ -n "$SUPABASE_URL" ]; then ARGS+=("-PSUPABASE_URL=$SUPABASE_URL"); fi
          if [ -n "$SUPABASE_PUBLISHABLE_KEY" ]; then ARGS+=("-PSUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY"); fi
          gradle :app:assembleDebug --stacktrace "${ARGS[@]}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RS-KICKBOX-preview-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
